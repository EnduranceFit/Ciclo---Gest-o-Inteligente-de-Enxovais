<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup Login Ciclo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
  
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
    <div class="absolute -top-[10%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-indigo-600/10 blur-3xl mix-blend-screen pointer-events-none"></div>
    <div class="absolute bottom-[0%] -right-[10%] w-[50vw] h-[50vw] rounded-full bg-orange-600/10 blur-3xl mix-blend-screen pointer-events-none"></div>
  </div>

  <div class="bg-white/95 backdrop-blur-3xl border border-white/20 rounded-[2rem] shadow-2xl p-8 sm:p-10 w-full max-w-lg relative z-10">
    
    <button class="mb-8 flex items-center gap-2 text-slate-500 hover:text-orange-500 transition-colors font-medium text-sm">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Voltar para Início
    </button>

    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-900 mb-4 shadow-lg border border-slate-700">
         <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Lagoa Ecotowers</h1>
      <p class="text-slate-500 text-sm">Autentique-se para operar a rouparia.</p>
    </div>

    <div class="space-y-6">
      
      <div class="p-4 bg-blue-50/50 border border-blue-100 rounded-xl flex items-center gap-4">
        <div class="w-12 h-12 rounded-full bg-blue-200 flex items-center justify-center text-blue-700 font-bold text-lg">AS</div>
        <div>
          <p class="text-sm text-slate-500 font-medium uppercase tracking-wider mb-0.5">Responsável (Bloco A)</p>
          <p class="text-slate-900 font-bold">ADRIANA SILVA</p>
        </div>
      </div>

      <div>
        <label class="block text-base font-medium text-gray-700 mb-2 flex items-center gap-2">
          Código PIN / Senha
        </label>
        <div class="relative">
          <input type="password" placeholder="••••" class="w-full rounded-xl border-gray-300 shadow-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 py-4 px-4 border bg-white text-2xl font-bold tracking-[0.5em] text-center" />
        </div>
      </div>

      <div class="pt-4 flex flex-col gap-3">
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-lg">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Autenticar e Acessar
        </button>
      </div>
    </div>
  </div>
</body>
</html>
